<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parents Portal | AIC Cathedral Comprehensive School</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="portal-page">

        <section class="login-card">

            <div class="brand">
                <div class="logo">AIC</div>

                <div>
                    <h1>AIC Cathedral</h1>
                    <p>Comprehensive School</p>
                </div>
            </div>

            <div class="portal-title">
                <span>Parents Portal</span>

                <h2>Welcome back</h2>

                <p>
                    Sign in using your parent code and password.
                </p>
            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="parentCode">
                        Parent Code
                    </label>

                    <input
                        type="text"
                        id="parentCode"
                        placeholder="Example: AIC-P001"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button type="submit" id="loginButton">
                    Sign In
                </button>


                <div id="loginMessage" class="message"></div>

            </form>


            <div class="login-footer">

                <p>
                    Your parent code is provided by the school.
                </p>

                <a href="../index.html">
                    ← Back to School Website
                </a>

            </div>

        </section>

    </main>


    <script type="module">

        import { createClient } from
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


        const SUPABASE_URL =
            "https://kadejswwappuvigiiyai.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_DlL8Q5i5ci55vX3OuhnwcQ_ONaNx7-k";


        const supabase =
            createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        const loginForm =
            document.getElementById("loginForm");


        const loginButton =
            document.getElementById("loginButton");


        const loginMessage =
            document.getElementById("loginMessage");


        function showMessage(message, type) {

            loginMessage.textContent = message;

            loginMessage.className =
                "message " + type;

        }


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const parentCode =
                    document
                        .getElementById("parentCode")
                        .value
                        .trim()
                        .toUpperCase();


                const password =
                    document
                        .getElementById("password")
                        .value;


                if (!parentCode || !password) {

                    showMessage(
                        "Please enter your parent code and password.",
                        "error"
                    );

                    return;

                }


                loginButton.disabled = true;

                loginButton.textContent =
                    "Signing in...";


                showMessage(
                    "Checking your account...",
                    "info"
                );


                try {

                    /*
                     * Find the parent using the special
                     * parent code.
                     */

                    const {
                        data: parent,
                        error: parentError
                    } = await supabase
                        .from("parents")
                        .select(
                            "id, full_name, email, parent_code"
                        )
                        .eq(
                            "parent_code",
                            parentCode
                        )
                        .maybeSingle();


                    if (parentError) {
                        throw parentError;
                    }


                    if (!parent) {

                        throw new Error(
                            "Invalid parent code."
                        );

                    }


                    /*
                     * The email is kept inside Supabase
                     * for authentication, but the parent
                     * does not need to enter it.
                     */

                    if (!parent.email) {

                        throw new Error(
                            "Your parent account does not have an email configured. Please contact the school."
                        );

                    }


                    /*
                     * Authenticate with Supabase.
                     */

                    const {
                        data,
                        error
                    } = await supabase.auth.signInWithPassword({

                        email: parent.email,

                        password: password

                    });


                    if (error) {
                        throw error;
                    }


                    if (!data.user) {

                        throw new Error(
                            "Unable to sign in."
                        );

                    }


                    /*
                     * Confirm the authenticated account
                     * belongs to the same parent record.
                     */

                    if (parent.email !== data.user.email) {

                        await supabase.auth.signOut();

                        throw new Error(
                            "Account verification failed."
                        );

                    }


                    sessionStorage.setItem(
                        "parent_name",
                        parent.full_name || ""
                    );


                    sessionStorage.setItem(
                        "parent_id",
                        String(parent.id)
                    );


                    sessionStorage.setItem(
                        "parent_code",
                        parent.parent_code
                    );


                    showMessage(
                        "Login successful. Opening your portal...",
                        "success"
                    );


                    setTimeout(function() {

                        window.location.href =
                            "dashboard.html";

                    }, 700);


                } catch (error) {

                    console.error(error);


                    showMessage(
                        error.message ||
                        "Unable to sign in. Please check your details.",
                        "error"
                    );


                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Sign In";

                }

            }
        );

    </script>

</body>
                    </html>
