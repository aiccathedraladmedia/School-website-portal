<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parents Portal | AIC Cathedral Comprehensive School</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="portal-page">

    <section class="login-card">

      <div class="brand">
        <div class="logo">AIC</div>

        <div>
          <h1>AIC Cathedral</h1>
          <p>Comprehensive School</p>
        </div>
      </div>

      <div class="portal-title">
        <span>Parents Portal</span>

        <h2>Welcome</h2>

        <p>
          Enter your child's portal code and your registered
          phone number to continue.
        </p>
      </div>

      <form id="loginForm">

        <div class="form-group">

          <label for="portalCode">
            Student Portal Code
          </label>

          <input
            type="text"
            id="portalCode"
            placeholder="Example: 2D2777C121"
            autocomplete="off"
            required
          >

        </div>


        <div class="form-group">

          <label for="phone">
            Registered Parent Phone
          </label>

          <input
            type="tel"
            id="phone"
            placeholder="Example: 0712345678"
            autocomplete="tel"
            required
          >

        </div>


        <button type="submit" id="loginButton">
          Login
        </button>

        <div id="loginMessage" class="message"></div>

      </form>


      <div class="login-footer">

        <p>
          Your child's portal code is provided by the school.
        </p>

        <a href="../index.html">
          ← Back to School Website
        </a>

      </div>

    </section>

  </main>


  <script type="module">

    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    const SUPABASE_URL =
      "https://kadejswwappuvigiiyai.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_DlL8Q5i5ci55vX3OuhnwcQ_ONaNx7-k";


    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const form =
      document.getElementById("loginForm");


    const button =
      document.getElementById("loginButton");


    const message =
      document.getElementById("loginMessage");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    function normalizePhone(phone) {

      let value =
        phone.replace(/\s+/g, "").trim();


      if (value.startsWith("+254")) {

        return "0" + value.substring(4);

      }


      if (value.startsWith("254")) {

        return "0" + value.substring(3);

      }


      return value;

    }


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const portalCode =
          document
            .getElementById("portalCode")
            .value
            .trim()
            .toUpperCase();


        const phone =
          normalizePhone(
            document
              .getElementById("phone")
              .value
          );


        if (!portalCode || !phone) {

          showMessage(
            "Please enter the portal code and phone number.",
            "error"
          );

          return;

        }


        button.disabled = true;

        button.textContent =
          "Checking...";


        showMessage(
          "Verifying your details...",
          "info"
        );


        try {

          /*
           * Find the student using the
           * automatically generated code.
           */

          const {
            data: student,
            error: studentError
          } = await supabase
            .from("students")
            .select(
              "id, first_name, middle_name, last_name, portal_code"
            )
            .eq(
              "portal_code",
              portalCode
            )
            .maybeSingle();


          if (studentError) {

            throw studentError;

          }


          if (!student) {

            throw new Error(
              "Invalid student portal code."
            );

          }


          /*
           * Find a parent linked to this
           * particular student.
           */

          const {
            data: relationship,
            error: relationshipError
          } = await supabase
            .from("student_parents")
            .select(`
              parent_id,
              is_primary,
              parents (
                id,
                full_name,
                phone
              )
            `)
            .eq(
              "student_id",
              student.id
            );


          if (relationshipError) {

            throw relationshipError;

          }


          /*
           * Compare the supplied phone number
           * against the phone numbers of the
           * parents linked to this student.
           */

          const matchedParent =
            relationship?.find(
              item => {

                const parentPhone =
                  normalizePhone(
                    item.parents?.phone || ""
                  );

                return parentPhone === phone;

              }
            );


          if (!matchedParent) {

            throw new Error(
              "The phone number does not match a parent registered for this student."
            );

          }


          /*
           * Save the verified session information.
           */

          sessionStorage.setItem(
            "parent_logged_in",
            "true"
          );


          sessionStorage.setItem(
            "student_id",
            String(student.id)
          );


          sessionStorage.setItem(
            "student_name",
            [
              student.first_name,
              student.middle_name,
              student.last_name
            ]
              .filter(Boolean)
              .join(" ")
          );


          sessionStorage.setItem(
            "portal_code",
            student.portal_code
          );


          sessionStorage.setItem(
            "parent_id",
            String(matchedParent.parent_id)
          );


          sessionStorage.setItem(
            "parent_name",
            matchedParent.parents.full_name || ""
          );


          showMessage(
            "Login successful. Opening your child's portal...",
            "success"
          );


          setTimeout(() => {

            window.location.href =
              "dashboard.html";

          }, 700);


        } catch (error) {

          console.error(error);


          showMessage(
            error.message ||
            "Unable to verify your details.",
            "error"
          );


          button.disabled = false;

          button.textContent =
            "Login";

        }

      }
    );

  </script>

</body>
    </html>
