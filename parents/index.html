<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Parents Portal | AIC Cathedral Comprehensive School
  </title>

  <link
    rel="stylesheet"
    href="../css/style.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .portal-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 18px;
      padding: 32px;
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.10);
    }

    .brand {
      text-align: center;
      margin-bottom: 26px;
    }

    .logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: #0b2d5c;
      color: #f4c542;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 22px;
    }

    .brand h1 {
      margin: 0;
      color: #0b2d5c;
      font-size: 25px;
    }

    .brand p {
      margin: 6px 0 0;
      color: #666;
    }

    .portal-title {
      text-align: center;
      margin-bottom: 25px;
    }

    .portal-title span {
      display: inline-block;
      background: #f4c542;
      color: #172033;
      padding: 7px 14px;
      border-radius: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .portal-title h2 {
      margin: 5px 0 12px;
      color: #0b2d5c;
    }

    .portal-title p {
      color: #666;
      line-height: 1.6;
      margin: 0;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccd4df;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #0b2d5c;
      box-shadow:
        0 0 0 3px rgba(11, 45, 92, 0.10);
    }

    .login-button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      background: #0b2d5c;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button:hover {
      opacity: 0.94;
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 9px;
      text-align: center;
      line-height: 1.5;
    }

    .message.info {
      display: block;
      background: #e9f2ff;
      color: #174a8b;
    }

    .message.error {
      display: block;
      background: #ffecec;
      color: #a30000;
    }

    .message.success {
      display: block;
      background: #eaf8ee;
      color: #16713a;
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      color: #777;
      font-size: 14px;
      line-height: 1.6;
    }

    .login-footer a {
      color: #0b2d5c;
      font-weight: bold;
      text-decoration: none;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 500px) {

      .portal-page {
        padding: 14px;
      }

      .login-card {
        padding: 24px 18px;
      }

      .brand h1 {
        font-size: 22px;
      }

    }

  </style>
</head>


<body>

  <main class="portal-page">

    <section class="login-card">

      <div class="brand">

        <div class="logo">
          AIC
        </div>

        <h1>
          AIC Cathedral
        </h1>

        <p>
          Comprehensive School
        </p>

      </div>


      <div class="portal-title">

        <span>
          Parents Portal
        </span>

        <h2>
          Welcome
        </h2>

        <p>
          Enter your child's portal code and
          your registered phone number to
          access the Parents Portal.
        </p>

      </div>


      <form id="loginForm">

        <div class="form-group">

          <label for="portalCode">
            Student Portal Code
          </label>

          <input
            type="text"
            id="portalCode"
            placeholder="Example: 2D2777C121"
            autocomplete="off"
            autocapitalize="characters"
            required
          >

        </div>


        <div class="form-group">

          <label for="phone">
            Registered Parent Phone
          </label>

          <input
            type="tel"
            id="phone"
            placeholder="Example: 0712345678"
            autocomplete="tel"
            required
          >

        </div>


        <button
          type="submit"
          id="loginButton"
          class="login-button"
        >
          Login
        </button>


        <div
          id="loginMessage"
          class="message"
        ></div>

      </form>


      <div class="login-footer">

        <p>
          Your child's portal code is provided
          by the school.
        </p>

        <p>
          Keep your portal code private.
        </p>

        <a href="../index.html">
          ← Back to School Website
        </a>

      </div>

    </section>

  </main>


  <script type="module">

    import {
      createClient
    }
    from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    // ---------------------------------
    // SUPABASE CONFIGURATION
    // ---------------------------------

    const SUPABASE_URL =
      "https://kadejswwapugivigiyai.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_DlLBQ5iC15x5X3OuhnwcQ_0NAxN7-k";


    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ---------------------------------
    // PAGE ELEMENTS
    // ---------------------------------

    const form =
      document.getElementById(
        "loginForm"
      );

    const button =
      document.getElementById(
        "loginButton"
      );

    const message =
      document.getElementById(
        "loginMessage"
      );


    // ---------------------------------
    // MESSAGE FUNCTION
    // ---------------------------------

    function showMessage(
      text,
      type
    ) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    // ---------------------------------
    // PHONE NORMALIZATION
    // ---------------------------------

    function normalizePhone(phone) {

      let value =
        phone
          .replace(/\s+/g, "")
          .trim();


      if (
        value.startsWith("+254")
      ) {

        return (
          "0" +
          value.substring(4)
        );

      }


      if (
        value.startsWith("254")
      ) {

        return (
          "0" +
          value.substring(3)
        );

      }


      return value;

    }


    // ---------------------------------
    // LOGIN
    // ---------------------------------

    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        const portalCode =
          document
            .getElementById(
              "portalCode"
            )
            .value
            .trim()
            .toUpperCase();


        const phone =
          normalizePhone(
            document
              .getElementById(
                "phone"
              )
              .value
          );


        if (
          !portalCode ||
          !phone
        ) {

          showMessage(
            "Please enter the portal code and registered phone number.",
            "error"
          );

          return;
        }


        button.disabled = true;

        button.textContent =
          "Checking...";


        showMessage(
          "Verifying your parent account...",
          "info"
        );


        try {

          // ---------------------------------
          // STEP 1:
          // VERIFY PORTAL CODE + PHONE
          // ---------------------------------

          const {
            data,
            error
          } =
            await supabase.functions.invoke(
              "parent-login",
              {
                body: {
                  portal_code:
                    portalCode,

                  phone:
                    phone
                }
              }
            );


          if (error) {

            console.error(
              "Function error:",
              error
            );

            throw new Error(
              "Unable to connect to the parent login service."
            );

          }


          if (
            !data ||
            !data.success
          ) {

            throw new Error(
              data?.error ||
              "Login verification failed."
            );

          }


          // ---------------------------------
          // STEP 2:
          // SIGN INTO SUPABASE AUTH
          // ---------------------------------

          showMessage(
            "Verification successful. Signing you in...",
            "info"
          );


          const {
            data: authData,
            error: authError
          } =
            await supabase.auth.signInWithPassword(
              {
                email:
                  data.email,

                password:
                  phone
              }
            );


          if (authError) {

            console.error(
              "Auth error:",
              authError
            );

            throw new Error(
              "Your parent account could not be signed in."
            );

          }


          if (
            !authData ||
            !authData.session
          ) {

            throw new Error(
              "No secure login session was created."
            );

          }


          // ---------------------------------
          // STEP 3:
          // SAVE PORTAL INFORMATION
          // ---------------------------------

          sessionStorage.setItem(
            "parent_logged_in",
            "true"
          );


          sessionStorage.setItem(
            "student_id",
            String(
              data.student.id
            )
          );


          sessionStorage.setItem(
            "student_name",
            [
              data.student.first_name,
              data.student.middle_name,
              data.student.last_name
            ]
              .filter(Boolean)
              .join(" ")
          );


          sessionStorage.setItem(
            "portal_code",
            data.student.portal_code
          );


          sessionStorage.setItem(
            "parent_id",
            String(
              data.parent.id
            )
          );


          sessionStorage.setItem(
            "parent_name",
            data.parent.full_name || ""
          );


          // ---------------------------------
          // LOGIN SUCCESS
          // ---------------------------------

          showMessage(
            "Login successful. Opening your child's portal...",
            "success"
          );


          button.textContent =
            "Opening Portal...";


          setTimeout(
            function () {

              window.location.href =
                "dashboard.html";

            },
            700
          );


        } catch (error) {

          console.error(
            error
          );


          showMessage(
            error.message ||
            "Unable to verify your details.",
            "error"
          );


          button.disabled = false;

          button.textContent =
            "Login";

        }

      }
    );

  </script>

</body>

    </html>
